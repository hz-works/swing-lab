name: Daily Scan

on:
  schedule:
    - cron: "15 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Scan
        working-directory: backtest
        run: python scan.py
      - name: Outcomes
        working-directory: backtest
        continue-on-error: true
        run: python outcomes.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs data
          git commit -m "Scan $(date -u +%F)" || echo "no changes"
          git pull --rebase
          git push
