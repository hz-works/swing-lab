name: Backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Backtest start date"
        default: "2016-01-01"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Run backtest
        working-directory: backtest
        run: python run.py --start "${{ inputs.start }}" --out ../results
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "Backtest results $(date -u +%F)" || echo "no changes"
          git push
