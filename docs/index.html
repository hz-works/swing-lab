<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Swing Scanner">
<meta name="theme-color" content="#0b1220">
<title>Swing Scanner</title>
<style>
  :root {
    --bg: #0b1220; --card: #131c2e; --line: #22304a; --text: #e8edf6; --muted: #8b98b0;
    --green: #2ecc71; --red: #ff5c5c; --amber: #f5b942; --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "SF Arabic", "Segoe UI", Tahoma, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 14px 40px;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .actions { display: flex; gap: 6px; }
  .btn {
    background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 11px; font-size: 14px; white-space: nowrap;
  }
  .market { border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; font-weight: 600; }
  .market.ok { background: rgba(46, 204, 113, .12); border: 1px solid rgba(46, 204, 113, .4); }
  .market.bad { background: rgba(255, 92, 92, .12); border: 1px solid rgba(255, 92, 92, .4); }
  .market small { display: block; font-weight: 400; color: var(--muted); margin-top: 3px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; }
  .tab {
    flex: 1; white-space: nowrap; background: var(--card); color: var(--muted);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 8px; font-size: 13px; text-align: center;
  }
  .tab.active { color: var(--text); border-color: var(--accent); background: rgba(79, 140, 255, .14); }
  .tab b { display: block; font-size: 16px; color: var(--text); }
  .hint { color: var(--muted); font-size: 12px; margin: 0 2px 10px; }
  .stock { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .row1 { display: flex; align-items: baseline; justify-content: space-between; }
  .sym { font-size: 19px; font-weight: 700; direction: ltr; }
  .price { font-size: 16px; direction: ltr; }
  .chg { font-size: 13px; margin-inline-start: 6px; }
  .n { direction: ltr; unicode-bidi: isolate; display: inline-block; }
  .up { color: var(--green); } .down { color: var(--red); }
  .metrics { display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin: 8px 0; }
  .metrics span b { color: var(--text); font-weight: 600; }
  .note { font-size: 12.5px; background: rgba(79, 140, 255, .1); border-radius: 8px; padding: 6px 8px; margin-bottom: 8px; }
  .row3 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .halal { font-size: 12px; border-radius: 8px; padding: 4px 8px; }
  .halal.pass { background: rgba(46, 204, 113, .14); color: var(--green); }
  .halal.doubtful { background: rgba(245, 185, 66, .14); color: var(--amber); }
  a.chart {
    color: #fff; background: var(--accent); text-decoration: none; border-radius: 9px;
    padding: 7px 12px; font-size: 13px; white-space: nowrap;
  }
  .links { display: flex; gap: 6px; }
  a.chart.web { background: transparent; border: 1px solid var(--accent); color: var(--text); }
  .toast {
    position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: #1f2a40; color: var(--text); border: 1px solid var(--accent); border-radius: 12px;
    padding: 10px 14px; font-size: 13.5px; opacity: 0; transition: opacity .2s; pointer-events: none;
    max-width: 92vw; text-align: center; z-index: 10;
  }
  .toast.show { opacity: 1; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }
  footer { color: var(--muted); font-size: 11.5px; margin-top: 18px; line-height: 1.6; }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="title"></h1>
    <div class="sub" id="date">…</div>
  </div>
  <div class="actions">
    <button class="btn" id="langBtn" onclick="toggleLang()"></button>
    <button class="btn" id="refreshBtn" onclick="load()"></button>
  </div>
</header>

<div id="market" class="market">…</div>
<div class="tabs" id="tabs"></div>
<div class="hint" id="hint"></div>
<div id="list"></div>
<footer id="footer"></footer>
<div class="toast" id="toast"></div>
